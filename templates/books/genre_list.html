{% extends 'base.html' %}

{% block title %}Жанры{% endblock %}

{% block content %}
<h1>Жанры</h1>

{% if genres %}
    <ul>
        {% for genre in genres %}
            <li>
                <strong>{{ genre.name }}</strong>
                {% if genre.description %}— {{ genre.description }}{% endif %}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>Пока жанров нет.</p>
{% endif %}
{% endblock %}

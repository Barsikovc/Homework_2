{% extends 'base.html' %}

{% block title %}Добавить книгу{% endblock %}

{% block content %}
<h1>Добавить книгу</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<p><a href="{% url 'books:book_list' %}">← Назад</a></p>
{% endblock %}

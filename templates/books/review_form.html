{% extends 'base.html' %}

{% block title %}Отзыв на «{{ book.title }}»{% endblock %}

{% block content %}
<h1>Отзыв на «{{ book.title }}»</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Отправить</button>
    <a href="{% url 'books:book_detail' book.pk %}" class="btn">Отмена</a>
</form>
{% endblock %}

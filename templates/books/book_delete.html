{% extends 'base.html' %}

{% block title %}Удалить книгу{% endblock %}

{% block content %}
<h1>Удалить книгу?</h1>

<p>Вы уверены, что хотите удалить <strong>{{ book.title }}</strong> — {{ book.author }}?</p>

<form method="post" class="delete-form">
    {% csrf_token %}
    <button type="submit" class="btn">Удалить</button>
    <a href="{% url 'books:book_detail' book.pk %}" class="btn">Отмена</a>
</form>
{% endblock %}

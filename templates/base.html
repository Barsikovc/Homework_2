{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Библиотека{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/delete.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="{% url 'books:book_list' %}">Книги</a>
        <a href="{% url 'books:genre_list' %}">Жанры</a>
        {% if user.is_authenticated %}
            <a href="{% url 'books:book_create' %}">Добавить книгу</a>
            <span>Привет, {{ user.username }}</span>
        {% else %}
            <a href="/admin/login/">Войти</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>

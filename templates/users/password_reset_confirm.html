{% extends 'base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<h1>Новый пароль</h1>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
    </form>
{% else %}
    <p>Ссылка недействительна. Запросите сброс пароля заново.</p>
{% endif %}
{% endblock %}
